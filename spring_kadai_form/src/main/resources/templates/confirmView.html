<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>お問い合わせ確認</title>
</head>
<body>

    <h1>お問い合わせ確認</h1>

    <p>
        <strong>お名前：</strong>
        <span th:text="${contactForm.getName()}"></span>
    </p>

    <p>
        <strong>メールアドレス：</strong>
        <span th:text="${contactForm.getEmail()}"></span>
    </p>

    <p>
        <strong>お問い合わせ内容：</strong>
    </p>

    <p th:text="${contactForm.getMessage()}"></p>

</body>
</html>
